<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Global Theme FOUC Prevention -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('kivanta_theme') || 'system';
          var r = s;
          if (s === 'system') {
            r = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.setAttribute('data-theme-preference', s);
          document.documentElement.classList.add('no-transitions');
        } catch (e) {}
      })();
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Solutions Manager | Kivanta Advisory Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-content-wrapper">
    <header class="admin-header" id="adminHeader"></header>

    <main class="admin-main">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title"><i class="fa-solid fa-briefcase"></i> Client Solutions & Market Pathways Manager</h1>
          <p class="admin-page-subtitle">Configure tailored corporate solution packages (Foreign Investors, Multinationals, Tech Founders, Local Enterprises).</p>
        </div>
        <div class="admin-page-actions">
          <button class="btn btn-primary" onclick="KivantaAdmin.openSolutionModal()"><i class="fa-solid fa-plus"></i> Add New Solution</button>
        </div>
      </div>

      <!-- Solutions Table Card -->
      <div class="admin-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Solution Title & Subtitle</th>
                <th>Target Profile</th>
                <th>Icon</th>
                <th>CTA Action</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="solutionsTbody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Solution Add/Edit Modal -->
  <div class="admin-modal-overlay" id="solutionModal">
    <div class="admin-modal-dialog" style="max-width: 650px;">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title" id="solModalTitle"><i class="fa-solid fa-briefcase"></i> Add Solution Profile</h3>
        <button class="admin-modal-close" onclick="KivantaAdmin.closeModal('solutionModal')">&times;</button>
      </div>
      <form id="solutionForm" onsubmit="KivantaAdmin.saveSolutionItem(event)">
        <div class="admin-modal-body">
          <input type="hidden" id="sId">
          
          <div style="margin-bottom: 16px;">
            <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">Solution Title *</label>
            <input type="text" id="sTitle" placeholder="e.g. Foreign Direct Investment Pathway" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;" required>
          </div>

          <div style="margin-bottom: 16px;">
            <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">Subtitle Summary</label>
            <input type="text" id="sSubtitle" placeholder="e.g. Turnkey market entry for multinational corporations" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
              <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">Target Client Profile</label>
              <input type="text" id="sTarget" placeholder="e.g. Foreign Companies, Tech Startups" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;">
            </div>
            <div>
              <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">FontAwesome Icon</label>
              <input type="text" id="sIcon" placeholder="e.g. fa-globe" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
              <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">CTA Button Text</label>
              <input type="text" id="sCta" placeholder="e.g. Explore FDI Package" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;">
            </div>
            <div>
              <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">CTA Button Link URL</label>
              <input type="text" id="sCtaLink" placeholder="contact.html?type=fdi" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;">
            </div>
          </div>

          <div>
            <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">Full Solution Description</label>
            <textarea id="sDesc" rows="4" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;"></textarea>
          </div>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="btn btn-secondary" onclick="KivantaAdmin.closeModal('solutionModal')">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Solution</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
    <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      KivantaAdmin.safeExecute(() => {
        KivantaAdmin.initPage('solutions');
        KivantaAdmin.renderSolutionsTable();
      }, 'Solutions Page Init');
    });

    if (typeof KivantaAdmin !== 'undefined') {
      KivantaAdmin.renderSolutionsTable = function() {
        const tbody = document.getElementById('solutionsTbody');
        if (!tbody) return;

        const list = KivantaDB.getSolutions ? KivantaDB.getSolutions() : [];
        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--color-text-muted);">No client solution profiles registered yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(s => `
          <tr>
            <td>
              <strong style="color: #fff; font-size: 0.9rem;">${KivantaAdmin.escapeHtml(s.title)}</strong>
              <div style="font-size: 0.78rem; color: var(--color-text-muted); margin-top: 4px;">${KivantaAdmin.escapeHtml(s.subtitle || '')}</div>
            </td>
            <td><span class="badge badge-info">${KivantaAdmin.escapeHtml(s.target || 'General')}</span></td>
            <td><i class="fa-solid ${s.icon || 'fa-briefcase'}" style="color: var(--color-gold); margin-right: 6px;"></i> ${KivantaAdmin.escapeHtml(s.icon || 'fa-briefcase')}</td>
            <td><small style="color: var(--color-gold); font-size: 0.8rem;">${KivantaAdmin.escapeHtml(s.cta || 'Learn More')}</small></td>
            <td style="text-align: right; whitespace: nowrap;">
              <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.78rem; margin-right: 4px;" onclick="KivantaAdmin.editSolutionItem('${s.id}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
              <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.78rem;" onclick="KivantaAdmin.deleteSolutionItem('${s.id}')"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `).join('');
      };

      KivantaAdmin.openSolutionModal = function() {
        document.getElementById('solutionForm').reset();
        document.getElementById('sId').value = '';
        document.getElementById('solModalTitle').innerHTML = '<i class="fa-solid fa-briefcase"></i> Add Solution Profile';
        KivantaAdmin.openModal('solutionModal');
      };

      KivantaAdmin.editSolutionItem = function(id) {
        const s = KivantaDB.getSolutions().find(x => x.id === id);
        if (s) {
          document.getElementById('sId').value = s.id;
          document.getElementById('sTitle').value = s.title || '';
          document.getElementById('sSubtitle').value = s.subtitle || '';
          document.getElementById('sTarget').value = s.target || '';
          document.getElementById('sIcon').value = s.icon || 'fa-briefcase';
          document.getElementById('sCta').value = s.cta || '';
          document.getElementById('sCtaLink').value = s.ctaLink || '';
          document.getElementById('sDesc').value = s.description || '';
          
          document.getElementById('solModalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Solution Profile';
          KivantaAdmin.openModal('solutionModal');
        }
      };

      KivantaAdmin.saveSolutionItem = function(e) {
        e.preventDefault();
        const item = {
          id: document.getElementById('sId').value || 'sol_' + Date.now(),
          title: document.getElementById('sTitle').value.trim(),
          subtitle: document.getElementById('sSubtitle').value.trim(),
          target: document.getElementById('sTarget').value.trim(),
          icon: document.getElementById('sIcon').value.trim() || 'fa-briefcase',
          cta: document.getElementById('sCta').value.trim(),
          ctaLink: document.getElementById('sCtaLink').value.trim(),
          description: document.getElementById('sDesc').value.trim()
        };

        KivantaDB.saveSolution(item);
        KivantaAdmin.closeModal('solutionModal');
        KivantaAdmin.showToast('Solution saved successfully!', 'success');
        KivantaAdmin.renderSolutionsTable();
      };

      KivantaAdmin.deleteSolutionItem = function(id) {
        if (confirm('Are you sure you want to delete this solution profile?')) {
          KivantaDB.deleteSolution(id);
          KivantaAdmin.showToast('Solution deleted.', 'info');
          KivantaAdmin.renderSolutionsTable();
        }
      };
    }
  </script>
</body>
</html>
