<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Global Theme FOUC Prevention -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('kivanta_theme') || 'system';
          var r = s;
          if (s === 'system') {
            r = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.setAttribute('data-theme-preference', s);
          document.documentElement.classList.add('no-transitions');
        } catch (e) {}
      })();
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Ecosystem Manager | Kivanta Advisory Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-content-wrapper">
    <header class="admin-header" id="adminHeader"></header>

    <main class="admin-main">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title"><i class="fa-solid fa-briefcase"></i> Service Ecosystem Manager</h1>
          <p class="admin-page-subtitle">Manage core advisory offerings, incorporation pathways, statutory fees, checklists, and service landing pages.</p>
        </div>
        <div class="admin-page-actions">
          <a href="service-editor.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add New Service</a>
        </div>
      </div>

      <!-- Toolbar & Filters -->
      <div class="admin-card" style="margin-bottom: 24px;">
        <div class="admin-card-body" style="padding: 16px 20px;">
          <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
            
            <div style="display: flex; gap: 12px; flex: 1; max-width: 600px;">
              <div style="position: relative; flex: 1;">
                <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"></i>
                <input type="text" id="adminServiceSearch" placeholder="Search services by name or description..." style="width: 100%; padding: 10px 14px 10px 40px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 0.88rem;" oninput="KivantaAdmin.renderServicesTable()">
              </div>

              <select id="adminCategoryFilter" style="padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 0.88rem;" onchange="KivantaAdmin.renderServicesTable()">
                <option value="all">All Categories</option>
              </select>

              <select id="adminStatusFilter" style="padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 0.88rem;" onchange="KivantaAdmin.renderServicesTable()">
                <option value="all">All Statuses</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>

            <span class="badge badge-info" id="servicesCountBadge">0 Services</span>

          </div>
        </div>
      </div>

      <!-- Services Table Card -->
      <div class="admin-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Service Name & Slug</th>
                <th>Category</th>
                <th>Statutory Fee</th>
                <th>Display Order</th>
                <th>Status</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="servicesAdminTbody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
    <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      KivantaAdmin.safeExecute(() => {
        KivantaAdmin.initPage('services');
        KivantaAdmin.populateCategoryFilter();
        KivantaAdmin.renderServicesTable();
      }, 'Services Page Init');
    });

    if (typeof KivantaAdmin !== 'undefined') {
      KivantaAdmin.populateCategoryFilter = function() {
        const select = document.getElementById('adminCategoryFilter');
        if (!select) return;

        const categories = KivantaDB.getCategories ? KivantaDB.getCategories() : [];
        let html = '<option value="all">All Categories</option>';
        categories.forEach(c => {
          html += `<option value="${c.id}">${KivantaAdmin.escapeHtml(c.name)}</option>`;
        });
        select.innerHTML = html;
      };

      KivantaAdmin.renderServicesTable = function() {
        const tbody = document.getElementById('servicesAdminTbody');
        const badge = document.getElementById('servicesCountBadge');
        if (!tbody) return;

        const services = KivantaDB.getServices ? KivantaDB.getServices(true) : [];
        const categories = KivantaDB.getCategories ? KivantaDB.getCategories() : [];
        
        const search = (document.getElementById('adminServiceSearch')?.value || '').toLowerCase();
        const catFilter = document.getElementById('adminCategoryFilter')?.value || 'all';
        const statusFilter = document.getElementById('adminStatusFilter')?.value || 'all';

        const filtered = services.filter(s => {
          const matchQuery = !search || 
            (s.name || '').toLowerCase().includes(search) ||
            (s.shortDesc || '').toLowerCase().includes(search) ||
            (s.slug || '').toLowerCase().includes(search);

          const matchCat = catFilter === 'all' || s.categoryId === catFilter || s.category === catFilter;
          const matchStatus = statusFilter === 'all' || (s.status || 'published') === statusFilter;

          return matchQuery && matchCat && matchStatus;
        });

        if (badge) badge.textContent = `${filtered.length} Services`;

        if (filtered.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; padding: 50px; color: var(--color-text-muted);">
                <i class="fa-solid fa-briefcase" style="font-size: 2.5rem; opacity: 0.3; margin-bottom: 12px; display: block;"></i>
                <div style="font-weight: 600; font-size: 1rem; color: #fff; margin-bottom: 4px;">No Services Found</div>
                <div style="font-size: 0.85rem; max-width: 440px; margin: 0 auto 16px;">Create a new service offering to publish on the Kivanta Advisory platform.</div>
                <a href="service-editor.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add New Service</a>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = filtered.map(s => {
          const catObj = categories.find(c => c.id === s.categoryId || c.slug === s.categoryId) || { name: s.category || s.categoryId || 'General' };
          let statusBadge = '<span class="badge badge-success">Published</span>';
          if (s.status === 'draft') statusBadge = '<span class="badge badge-warning">Draft</span>';

          return `
            <tr>
              <td>
                <strong style="color: #fff; font-size: 0.92rem;">${KivantaAdmin.escapeHtml(s.name)}</strong>
                ${s.featured ? '<span class="badge badge-gold" style="margin-left: 6px; font-size: 0.68rem;">Featured</span>' : ''}
                <div style="font-size: 0.76rem; color: var(--color-gold); font-family: monospace;">/services/${KivantaAdmin.escapeHtml(s.slug)}.html</div>
              </td>
              <td><span class="badge badge-info">${KivantaAdmin.escapeHtml(catObj.name)}</span></td>
              <td style="font-size: 0.84rem; color: #e2e8f0;">${KivantaAdmin.escapeHtml(s.timelines?.governmentFee || 'Custom Package')}</td>
              <td style="font-size: 0.85rem; color: #fff;">${s.displayOrder || 1}</td>
              <td>${statusBadge}</td>
              <td style="text-align: right; whitespace: nowrap;">
                <a href="service-editor.html?slug=${s.slug}" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.78rem; margin-right: 4px;" title="Edit Service"><i class="fa-solid fa-pen-to-square"></i> Edit</a>
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.78rem; margin-right: 4px;" onclick="KivantaAdmin.duplicateServiceItem('${s.id}')" title="Duplicate Service"><i class="fa-regular fa-copy"></i></button>
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.78rem; margin-right: 4px;" onclick="KivantaAdmin.toggleServiceStatus('${s.id}')" title="Toggle Status"><i class="fa-solid fa-power-off"></i></button>
                <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.78rem;" onclick="KivantaAdmin.deleteServiceItem('${s.id}')" title="Delete Service"><i class="fa-solid fa-trash-can"></i></button>
              </td>
            </tr>
          `;
        }).join('');
      };

      KivantaAdmin.toggleServiceStatus = function(id) {
        const s = KivantaDB.getServiceBySlug(id);
        if (s) {
          s.status = s.status === 'published' ? 'draft' : 'published';
          KivantaDB.saveService(s);
          KivantaAdmin.showToast(`Service status updated to ${s.status}`, 'info');
          KivantaAdmin.renderServicesTable();
        }
      };

      KivantaAdmin.duplicateServiceItem = function(id) {
        const s = KivantaDB.getServiceBySlug(id);
        if (s) {
          const dup = JSON.parse(JSON.stringify(s));
          dup.id = 'service_' + Date.now();
          dup.slug = s.slug + '-copy';
          dup.name = s.name + ' (Copy)';
          dup.status = 'draft';
          KivantaDB.saveService(dup);
          KivantaAdmin.showToast('Service duplicated as draft.', 'success');
          KivantaAdmin.renderServicesTable();
        }
      };

      KivantaAdmin.deleteServiceItem = function(id) {
        if (confirm('Are you sure you want to delete this service offering?')) {
          if (KivantaDB.deleteService) {
            KivantaDB.deleteService(id);
          }
          KivantaAdmin.showToast('Service deleted successfully.', 'info');
          KivantaAdmin.renderServicesTable();
        }
      };
    }
  </script>
</body>
</html>
