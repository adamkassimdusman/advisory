<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <!-- Global Theme FOUC Prevention -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('kivanta_theme') || 'system';
          var r = s;
          if (s === 'system') {
            r = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.setAttribute('data-theme-preference', s);
          document.documentElement.classList.add('no-transitions');
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8">
    <title>Admin Login — Kivanta Advisory Portal</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background-color: var(--bg-primary);">

    <div class="card-custom p-4 p-md-5" style="width: 100%; max-width: 440px; background-color: var(--bg-surface);">
        <div class="text-center mb-4">
            <div class="icon-box mx-auto mb-3"><i class="fas fa-shield-alt"></i></div>
            <h3 class="font-heading mb-1">Kivanta Admin Portal</h3>
            <p class="text-muted small">Sign in to manage website content & inquiries</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none small mb-3" role="alert"></div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label class="form-label font-heading small">Email or Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="fas fa-user"></i></span>
                    <input type="text" id="loginUsername" class="form-control border-start-0 ps-0" value="admin@kivanta.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label font-heading small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="fas fa-lock"></i></span>
                    <input type="password" id="loginPassword" class="form-control border-start-0 border-end-0 ps-0 pe-0" value="Kivanta2026!" required>
                    <button type="button" class="input-group-text bg-transparent border-start-0" id="togglePasswordBtn" style="border-color: var(--border-color); color: var(--text-muted);"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                </div>
                <a href="#" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal" class="small">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3"><i class="fas fa-sign-in-alt me-2"></i>Sign In to Dashboard</button>
        </form>

        <div class="text-center text-muted small border-top pt-3 mt-2" style="font-size: 0.8rem;">
            Default Credentials: <code>admin@kivanta.com</code> / <code>Kivanta2026!</code>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: var(--bg-card); color: var(--text-main);">
                <div class="modal-header">
                    <h5 class="modal-title font-heading"><i class="fas fa-key text-warning me-2"></i>Reset Admin Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Enter your registered admin email address to receive password reset instructions.</p>
                    <input type="email" class="form-control mb-3" placeholder="admin@kivanta.com">
                    <button type="button" onclick="alert('Reset link dispatched if email exists.')" class="btn btn-primary w-100" data-bs-dismiss="modal">Dispatch Reset Link</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Password visibility toggle
            $('#togglePasswordBtn').on('click', function() {
                const $pwd = $('#loginPassword');
                const type = $pwd.attr('type') === 'password' ? 'text' : 'password';
                $pwd.attr('type', type);
                $(this).find('i').toggleClass('fa-eye fa-eye-slash');
            });

            // Login submission
            $('#adminLoginForm').on('submit', function(e) {
                e.preventDefault();
                const username = $('#loginUsername').val().trim();
                const password = $('#loginPassword').val().trim();

                const res = window.KivantaAdmin.login(username, password);
                if (res.success) {
                    window.location.href = 'index.html';
                } else {
                    $('#loginAlert').text(res.message).removeClass('d-none');
                }
            });
        });
    </script>
</body>
</html>
