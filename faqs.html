<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Global Theme FOUC Prevention -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('kivanta_theme') || 'system';
          var r = s;
          if (s === 'system') {
            r = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.setAttribute('data-theme-preference', s);
          document.documentElement.classList.add('no-transitions');
        } catch (e) {}
      })();
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ Management | Kivanta Advisory Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-content-wrapper">
    <header class="admin-header" id="adminHeader"></header>

    <main class="admin-main">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title"><i class="fa-solid fa-circle-question"></i> Frequently Asked Questions Manager</h1>
          <p class="admin-page-subtitle">Curate customer knowledgebase answers on business setup, statutory timelines, work permits, and regulatory compliance.</p>
        </div>
        <div class="admin-page-actions">
          <button class="btn btn-primary" onclick="KivantaAdmin.openFaqModal()"><i class="fa-solid fa-plus"></i> Add New FAQ</button>
        </div>
      </div>

      <!-- FAQ Table Card -->
      <div class="admin-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Question & Answer Preview</th>
                <th>Category</th>
                <th>Status</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="faqsAdminTbody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- FAQ Add/Edit Modal -->
  <div class="admin-modal-overlay" id="faqModal">
    <div class="admin-modal-dialog" style="max-width: 650px;">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title" id="faqModalTitle"><i class="fa-solid fa-circle-plus"></i> Add FAQ Record</h3>
        <button class="admin-modal-close" onclick="KivantaAdmin.closeModal('faqModal')">&times;</button>
      </div>
      <form id="faqForm" onsubmit="KivantaAdmin.saveFaqItem(event)">
        <div class="admin-modal-body">
          <input type="hidden" id="fId">
          
          <div style="margin-bottom: 16px;">
            <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">Question Title *</label>
            <input type="text" id="fQuestion" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
              <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">Category</label>
              <input type="text" id="fCategory" placeholder="e.g. Setup, Tax, Immigration" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;">
            </div>
            <div>
              <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">Status</label>
              <select id="fStatus" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;">
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>
          </div>

          <div>
            <label class="form-label" style="display: block; font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 6px;">Detailed Answer *</label>
            <textarea id="fAnswer" rows="5" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;" required></textarea>
          </div>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="btn btn-secondary" onclick="KivantaAdmin.closeModal('faqModal')">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save FAQ</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
    <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      KivantaAdmin.safeExecute(() => {
        KivantaAdmin.initPage('faqs');
        KivantaAdmin.renderFaqsTable();
      }, 'FAQs Page Init');
    });

    if (typeof KivantaAdmin !== 'undefined') {
      KivantaAdmin.renderFaqsTable = function() {
        const tbody = document.getElementById('faqsAdminTbody');
        if (!tbody) return;

        const list = KivantaDB.getAllFAQs ? KivantaDB.getAllFAQs() : [];
        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--color-text-muted);">No FAQ records logged yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(f => `
          <tr>
            <td>
              <strong style="color: #fff; font-size: 0.9rem;">${KivantaAdmin.escapeHtml(f.question)}</strong>
              <div style="font-size: 0.78rem; color: var(--color-text-muted); margin-top: 4px;">${KivantaAdmin.escapeHtml((f.answer || '').substring(0, 100))}...</div>
            </td>
            <td><span class="badge badge-info">${KivantaAdmin.escapeHtml(f.category || 'General')}</span></td>
            <td><span class="badge badge-success">Published</span></td>
            <td style="text-align: right; whitespace: nowrap;">
              <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.78rem; margin-right: 4px;" onclick="KivantaAdmin.editFaqItem('${f.id}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
              <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.78rem;" onclick="KivantaAdmin.deleteFaqItem('${f.id}')"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `).join('');
      };

      KivantaAdmin.openFaqModal = function() {
        document.getElementById('faqForm').reset();
        document.getElementById('fId').value = '';
        document.getElementById('faqModalTitle').innerHTML = '<i class="fa-solid fa-circle-plus"></i> Add FAQ Record';
        KivantaAdmin.openModal('faqModal');
      };

      KivantaAdmin.editFaqItem = function(id) {
        const f = KivantaDB.getAllFAQs().find(x => x.id === id);
        if (f) {
          document.getElementById('fId').value = f.id;
          document.getElementById('fQuestion').value = f.question || '';
          document.getElementById('fCategory').value = f.category || 'General';
          document.getElementById('fStatus').value = f.status || 'published';
          document.getElementById('fAnswer').value = f.answer || '';
          
          document.getElementById('faqModalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit FAQ Record';
          KivantaAdmin.openModal('faqModal');
        }
      };

      KivantaAdmin.saveFaqItem = function(e) {
        e.preventDefault();
        const item = {
          id: document.getElementById('fId').value || 'faq_' + Date.now(),
          question: document.getElementById('fQuestion').value.trim(),
          category: document.getElementById('fCategory').value.trim() || 'General',
          status: document.getElementById('fStatus').value,
          answer: document.getElementById('fAnswer').value.trim()
        };

        KivantaDB.saveFAQ(item);
        KivantaAdmin.closeModal('faqModal');
        KivantaAdmin.showToast('FAQ saved successfully!', 'success');
        KivantaAdmin.renderFaqsTable();
      };

      KivantaAdmin.deleteFaqItem = function(id) {
        if (confirm('Are you sure you want to delete this FAQ?')) {
          KivantaDB.deleteFAQ(id);
          KivantaAdmin.showToast('FAQ deleted.', 'info');
          KivantaAdmin.renderFaqsTable();
        }
      };
    }
  </script>
</body>
</html>
