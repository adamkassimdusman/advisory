<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <!-- Global Theme FOUC Prevention -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('kivanta_theme') || 'system';
          var r = s;
          if (s === 'system') {
            r = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.setAttribute('data-theme-preference', s);
          document.documentElement.classList.add('no-transitions');
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8">
    <title>Kenya Business eTA & Entry Assistance | Investor Travel | Kivanta Advisory</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Business Entry & eTA Assistance, Kenya business advisory, regulatory compliance Nairobi, Kivanta Advisory" name="keywords">
    <meta content="Guidance on electronic Travel Authorization (eTA), business visas, and entry protocols for visiting investors and executives." name="description">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Stylesheets -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Spinner -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading Service Page...</span>
        </div>
    </div>

    <!-- Topbar -->
    <div class="container-fluid topbar px-5 d-none d-lg-block">
        <div class="row gx-0 align-items-center" style="height: 45px;">
            <div class="col-lg-7 text-start">
                <div class="d-flex align-items-center gap-4">
                    <span><i class="fas fa-map-marker-alt text-warning me-2"></i>Westlands Commercial Center, Nairobi, Kenya</span>
                    <a href="mailto:info@kivantaadvisory.com"><i class="fas fa-envelope text-warning me-2"></i>info@kivantaadvisory.com</a>
                    <a href="tel:+254700000000"><i class="fas fa-phone-alt text-warning me-2"></i>+254 700 000 000</a>
                </div>
            </div>
            <div class="col-lg-5 text-end d-flex align-items-center justify-content-end gap-3">
                <span class="badge bg-warning text-dark font-heading">Kenya Business Advisory</span>
                <button class="theme-toggle-btn ms-2" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <div class="container-fluid nav-bar p-0">
        <nav class="navbar navbar-expand-lg navbar-light px-4 px-lg-5 py-3">
            <a href="../index.html" class="navbar-brand p-0">
                <h2 class="brand-name m-0"><i class="fas fa-shield-alt text-warning me-2"></i>Kivanta Advisory</h2>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto py-0">
                    <a href="../index.html" class="nav-item nav-link">Home</a>
                    <a href="../service.html" class="nav-item nav-link active">Services</a>
                    <a href="../solutions.html" class="nav-item nav-link">Solutions</a>
                    <a href="../about.html" class="nav-item nav-link">About Us</a>
                    <a href="../insights.html" class="nav-item nav-link">Insights</a>
                    <a href="../faqs.html" class="nav-item nav-link">FAQs</a>
                    <a href="../contact.html" class="nav-item nav-link">Contact</a>
                </div>
                <div class="d-flex align-items-center gap-2 ms-lg-3">
                    <a href="../proposal.html" class="btn btn-outline-gold me-1">Request a Proposal</a>
                    <button onclick="openConsultationModal('Business Entry & eTA Assistance')" class="btn btn-primary">Book Consultation</button>
                </div>
            </div>
        </nav>
    </div>

    <!-- Dynamic Container -->
    <div id="serviceDetailContainer"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="border-top border-secondary pt-4 text-center text-white-50 small">
                <p class="mb-0">© 2026 Kivanta Advisory. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>

    <script>
        const SERVICE_SLUG = 'business-entry';

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.KivantaDB) {
                await window.KivantaDB.init();
                const service = window.KivantaDB.getServiceBySlug(SERVICE_SLUG);
                if (service) {
                    renderServicePage(service);
                }
            }
        });

        function renderServicePage(service) {
            const categories = window.KivantaDB.getCategories();
            const cat = categories.find(c => c.id === service.categoryId) || { name: 'Business Setup' };
            const allServices = window.KivantaDB.getServices();

            let html = `
                <div class="container-fluid bg-breadcrumb text-center">
                    <div class="container py-4" style="max-width: 900px;">
                        <span class="badge-category mb-3">${cat.name}</span>
                        <h1 class="display-4 text-white mb-3">${service.heroTitle || service.name}</h1>
                        <p class="text-white-50 lead mb-4">${service.heroSubtitle || service.shortDesc}</p>
                        <div class="d-flex flex-wrap gap-3 justify-content-center">
                            <button onclick="openConsultationModal('${service.name.replace(/'/g, "\\'")}')" class="btn btn-secondary btn-lg"><i class="fas fa-calendar-check me-2"></i>Book a Consultation</button>
                            <a href="../proposal.html" class="btn btn-outline-light btn-lg"><i class="fas fa-paper-plane me-2"></i>Request a Quote</a>
                        </div>
                    </div>
                </div>

                <div class="py-5" style="background-color: var(--bg-primary);">
                    <div class="container py-4">
                        <div class="row g-5">

                            <!-- Main Content Column -->
                            <div class="col-lg-8">
                                <div class="card-custom mb-4" style="background-color: var(--bg-surface);">
                                    <h3 class="mb-3"><i class="fas fa-info-circle text-warning me-2"></i>Service Overview</h3>
                                    <p class="text-muted leading-relaxed">${service.overview || service.fullDesc}</p>

                                    <h5 class="font-heading mt-4 mb-3">Who This Service Is For</h5>
                                    <div class="d-flex flex-wrap gap-2 mb-4">
                                        ${(service.audiences || []).map(a => `<span class="badge bg-warning text-dark px-3 py-2 font-heading"><i class="fas fa-user-check me-1"></i>${a}</span>`).join('')}
                                    </div>
                                </div>

                                <div class="card-custom mb-4" style="background-color: var(--bg-surface);">
                                    <h3 class="mb-4"><i class="fas fa-tasks text-warning me-2"></i>What We Handle</h3>
                                    <div class="checklist-grid">
                                        ${(service.checklists || []).map(item => `
                                            <div class="checklist-card-item">
                                                <i class="fas fa-check-circle"></i>
                                                <span class="font-heading text-main small">${item}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="card-custom mb-4" style="background-color: var(--bg-surface);">
                                    <h3 class="mb-4"><i class="fas fa-stream text-warning me-2"></i>Engagement Process</h3>
                                    <div class="process-timeline">
                                        ${(service.processSteps || []).map(step => `
                                            <div class="process-step-item">
                                                <div class="step-number">${step.number}</div>
                                                <div>
                                                    <h5 class="font-heading mb-1">${step.title}</h5>
                                                    <p class="text-muted small mb-0">${step.description}</p>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="card-custom mb-4" style="background-color: var(--bg-surface);">
                                    <h3 class="mb-4"><i class="fas fa-folder-open text-warning me-2"></i>Requirements & Documents Needed</h3>
                                    <ul class="list-unstyled space-y-3">
                                        ${(service.requirements || []).map(req => `
                                            <li class="d-flex align-items-start gap-3 p-3 border rounded" style="background: var(--bg-card);">
                                                <i class="fas fa-file-alt text-warning mt-1"></i>
                                                <span class="text-main font-heading small">${req}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>

                                ${service.faqs && service.faqs.length ? `
                                    <div class="card-custom mb-4" style="background-color: var(--bg-surface);">
                                        <h3 class="mb-4"><i class="fas fa-question-circle text-warning me-2"></i>Frequently Asked Questions</h3>
                                        <div class="accordion" id="serviceFaqAccordion">
                                            ${service.faqs.map((faq, idx) => `
                                                <div class="accordion-item">
                                                    <h2 class="accordion-header" id="headingS_${idx}">
                                                        <button class="accordion-button ${idx !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#collapseS_${idx}">
                                                            ${faq.question}
                                                        </button>
                                                    </h2>
                                                    <div id="collapseS_${idx}" class="accordion-collapse collapse ${idx === 0 ? 'show' : ''}" data-bs-parent="#serviceFaqAccordion">
                                                        <div class="accordion-body">${faq.answer}</div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Right Sidebar Column -->
                            <div class="col-lg-4">
                                <div class="fee-table-box mb-4 p-4">
                                    <h4 class="font-heading mb-3"><i class="fas fa-calculator text-warning me-2"></i>Timelines & Fees</h4>
                                    <div class="mb-3">
                                        <small class="text-muted d-block">Estimated Government Fee</small>
                                        <strong class="text-main font-heading">${service.timelines?.governmentFee || 'Subject to statutory schedule'}</strong>
                                    </div>
                                    <div class="mb-3">
                                        <small class="text-muted d-block">Kivanta Professional Fee</small>
                                        <strong class="text-warning font-heading">${service.timelines?.professionalFee || 'Request a Quote'}</strong>
                                    </div>
                                    <div class="mb-3">
                                        <small class="text-muted d-block">Estimated Timeline</small>
                                        <strong class="text-main font-heading"><i class="fas fa-clock text-warning me-1"></i>${service.timelines?.estimatedTimeline || '3 - 7 Days'}</strong>
                                    </div>
                                    <hr class="my-3">
                                    <p class="text-muted small mb-4" style="font-size: 0.8rem;">
                                        <i class="fas fa-exclamation-triangle text-warning me-1"></i>
                                        ${service.timelines?.disclaimer || 'Government fees and timelines are subject to official agency updates.'}
                                    </p>
                                    <button onclick="openConsultationModal('${service.name.replace(/'/g, "\\'")}')" class="btn btn-primary w-100 mb-2"><i class="fas fa-calendar-check me-2"></i>Book a Consultation</button>
                                    <a href="../proposal.html" class="btn btn-outline-gold w-100"><i class="fas fa-paper-plane me-2"></i>Request a Proposal</a>
                                </div>

                                <div class="card-custom" style="background-color: var(--bg-surface);">
                                    <h5 class="font-heading mb-3"><i class="fas fa-link text-warning me-2"></i>You May Also Need</h5>
                                    <div class="space-y-3">
                                        ${(service.relatedServices || []).map(relSlug => {
                                            const rel = allServices.find(s => s.slug === relSlug || s.id === relSlug);
                                            if (!rel) return '';
                                            return `
                                                <a href="${rel.slug}.html" class="d-block p-3 border rounded text-decoration-none text-main hover-gold" style="background: var(--bg-card);">
                                                    <h6 class="font-heading mb-1 text-warning">${rel.name}</h6>
                                                    <small class="text-muted d-block">${rel.shortDesc.substring(0, 70)}...</small>
                                                </a>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            `;

            $('#serviceDetailContainer').html(html);
        }
    </script>
</body>

</html>
