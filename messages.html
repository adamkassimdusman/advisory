<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <!-- Global Theme FOUC Prevention -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('kivanta_theme') || 'system';
          var r = s;
          if (s === 'system') {
            r = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.setAttribute('data-theme-preference', s);
          document.documentElement.classList.add('no-transitions');
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8">
    <title>Contact Messages Inbox — Kivanta Admin Portal</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div class="admin-layout">
        <aside class="admin-sidebar"></aside>

        <main class="admin-main">
            <header class="admin-header"></header>

            <div class="admin-content">

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h4 class="font-heading m-0"><i class="fas fa-envelope text-warning me-2"></i>Contact Messages Inbox</h4>
                        <small class="text-muted">Manage general inquiries submitted via the public contact center.</small>
                    </div>
                </div>

                <!-- Filters & Search -->
                <div class="card-custom mb-4" style="background-color: var(--bg-surface);">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" id="msgSearchInput" class="form-control" placeholder="Search by sender name, email, or message subject...">
                        </div>
                        <div class="col-md-3">
                            <select id="msgStatusFilter" class="form-select">
                                <option value="all">All Message Statuses</option>
                                <option value="Unread">Unread Only</option>
                                <option value="Read">Read</option>
                                <option value="Archived">Archived</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="msgCategoryFilter" class="form-select">
                                <option value="all">All Service Categories</option>
                                <option value="Market Entry">Market Entry</option>
                                <option value="Corporate Secretarial">Corporate Secretarial</option>
                                <option value="Tax Compliance">Tax Compliance</option>
                                <option value="Immigration">Immigration</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Messages Table -->
                <div class="admin-table-container">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Sender / Email</th>
                                <th>Company & Phone</th>
                                <th>Subject</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="messagesTbody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Message Detail Preview Modal -->
    <div class="modal fade" id="messageDetailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" style="background-color: var(--bg-card); color: var(--text-main);">
                <div class="modal-header">
                    <h5 class="modal-title font-heading"><i class="fas fa-envelope-open text-warning me-2"></i>Contact Message Specification</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="msgIdInput">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <small class="text-muted d-block">Sender Name</small>
                            <strong class="text-main font-heading" id="msgSenderName"></strong>
                        </div>
                        <div class="col-md-6">
                            <small class="text-muted d-block">Company & Organization</small>
                            <strong class="text-main font-heading" id="msgCompany"></strong>
                        </div>
                        <div class="col-md-6">
                            <small class="text-muted d-block">Email Address</small>
                            <a id="msgEmailLink" href="#" class="font-heading text-warning"></a>
                        </div>
                        <div class="col-md-6">
                            <small class="text-muted d-block">Telephone / WhatsApp</small>
                            <strong class="text-main font-heading" id="msgPhone"></strong>
                        </div>
                        <div class="col-12">
                            <small class="text-muted d-block">Subject</small>
                            <h6 class="font-heading text-main mt-1" id="msgSubjectText"></h6>
                        </div>
                        <div class="col-12">
                            <small class="text-muted d-block mb-1">Message Content</small>
                            <div class="p-3 border rounded font-body text-main leading-relaxed" style="background: rgba(15,37,55,0.03);" id="msgBodyText"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center justify-content-between pt-2">
                        <button type="button" onclick="deleteCurrentMessage()" class="btn btn-outline-danger btn-sm"><i class="fas fa-trash me-1"></i>Delete Message</button>
                        <div class="d-flex gap-2">
                            <a id="msgReplyBtn" href="#" class="btn btn-gold btn-sm" target="_blank"><i class="fas fa-reply me-1"></i>Reply via Email</a>
                            <button type="button" onclick="markMessageReadStatus()" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            KivantaAdmin.safeExecute(async () => {
                if (window.KivantaDB) {
                    await window.KivantaDB.init();
                    renderMessagesTable();
                }

                $('#msgSearchInput, #msgStatusFilter, #msgCategoryFilter').on('input change', renderMessagesTable);
            }, '.admin-content', 'Unable to Load Contact Messages Inbox');
        });

        function renderMessagesTable() {
            const list = window.KivantaDB.getContactMessages() || [];
            const search = ($('#msgSearchInput').val() || '').toLowerCase();
            const statusFilter = $('#msgStatusFilter').val();
            const catFilter = $('#msgCategoryFilter').val();

            let rows = '';
            list.forEach(m => {
                const matchesSearch = !search || (m.name && m.name.toLowerCase().includes(search)) || (m.email && m.email.toLowerCase().includes(search)) || (m.subject && m.subject.toLowerCase().includes(search));
                const matchesStatus = statusFilter === 'all' || m.status === statusFilter;
                const matchesCat = catFilter === 'all' || m.category === catFilter;

                if (matchesSearch && matchesStatus && matchesCat) {
                    const isUnread = m.status === 'Unread';
                    rows += `
                        <tr style="${isUnread ? 'font-weight: 600;' : ''}">
                            <td>
                                <strong class="font-heading">${m.name || 'Anonymous Sender'}</strong><br>
                                <small class="text-muted">${m.email || 'No email'}</small>
                            </td>
                            <td>${m.company || 'N/A'}<br><small class="text-muted">${m.phone || ''}</small></td>
                            <td>${m.subject || 'General Inquiry'}</td>
                            <td><span class="badge-category">${m.category || 'General'}</span></td>
                            <td><small class="text-muted">${m.date ? new Date(m.date).toLocaleDateString() : 'Recent'}</small></td>
                            <td>
                                <span class="badge ${isUnread ? 'bg-danger' : 'bg-secondary'}">${m.status || 'Read'}</span>
                            </td>
                            <td>
                                <button onclick="viewMessage('${m.id}')" class="btn btn-sm btn-outline-primary py-1 px-2 me-1" title="View Message"><i class="fas fa-envelope-open"></i></button>
                                <button onclick="deleteMessage('${m.id}')" class="btn btn-sm btn-outline-danger py-1 px-2" title="Delete Message"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }
            });

            if (!rows) {
                rows = '<tr><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-envelope text-warning me-2"></i>No contact messages match your selected search filters.</td></tr>';
            }

            $('#messagesTbody').html(rows);
        }

        function viewMessage(id) {
            const list = window.KivantaDB.getContactMessages() || [];
            const m = list.find(x => x.id === id);
            if (m) {
                $('#msgIdInput').val(m.id);
                $('#msgSenderName').text(m.name || 'Anonymous');
                $('#msgCompany').text(m.company || 'N/A');
                $('#msgEmailLink').attr('href', 'mailto:' + (m.email || '')).text(m.email || 'N/A');
                $('#msgPhone').text(m.phone || 'N/A');
                $('#msgSubjectText').text(m.subject || 'No Subject');
                $('#msgBodyText').text(m.message || 'No message content provided.');
                $('#msgReplyBtn').attr('href', 'mailto:' + (m.email || '') + '?subject=RE: ' + encodeURIComponent(m.subject || 'Kivanta Advisory Inquiry'));

                // Mark read
                m.status = 'Read';
                window.KivantaDB.saveContactMessage(m);
                renderMessagesTable();

                new bootstrap.Modal(document.getElementById('messageDetailModal')).show();
            }
        }

        function markMessageReadStatus() {
            renderMessagesTable();
        }

        function deleteCurrentMessage() {
            const id = $('#msgIdInput').val();
            deleteMessage(id);
            const modalEl = document.getElementById('messageDetailModal');
            const modalInst = bootstrap.Modal.getInstance(modalEl);
            if (modalInst) modalInst.hide();
        }

        function deleteMessage(id) {
            if (confirm('Are you sure you want to delete this contact message?')) {
                window.KivantaDB.deleteContactMessage(id);
                window.KivantaAdmin.showToast('Contact message deleted');
                renderMessagesTable();
            }
        }
    </script>
</body>

</html>
